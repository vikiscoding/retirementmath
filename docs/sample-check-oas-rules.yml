# Readable copy of the live workflow at .github/workflows/check-oas-rules.yml.
# Keep the two in step. The live file is what GitHub runs.
# Runs weekly, checks canada.ca, and opens a pull request if the check date or a figure changed. A human merges.
name: check-oas-rules
on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays 13:17 UTC
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      # The script fetches with curl over IPv4. Python urlopen stalls on this runner.
      - name: Check rules against canada.ca
        id: check
        run: python3 scripts/check_rules.py --update --summary-file "$RUNNER_TEMP/oas-check.md"
      - name: Test calculator math
        run: node tests/test_calc.js
      - name: Open PR if anything changed
        if: steps.check.outputs.kind == 'date' || steps.check.outputs.kind == 'figures'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/oas-rules-update
          title: ${{ steps.check.outputs.title }}
          body-path: ${{ runner.temp }}/oas-check.md
          commit-message: ${{ steps.check.outputs.commit }}
