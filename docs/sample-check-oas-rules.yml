# SAMPLE ONLY. Not active. It lives outside .github/workflows so a push does not turn it on.
# To use it, copy this file to .github/workflows/ after the owner asks.
# Runs weekly, checks canada.ca, and opens a pull request if thresholds changed. A human merges.
name: check-oas-rules
on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays 13:17 UTC
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Check rules against canada.ca
        run: python3 scripts/check_rules.py --update
      - name: Test calculator math
        run: node tests/test_calc.js
      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/oas-rules-update
          title: "OAS rules changed on canada.ca"
          body: "Automated check found changes. Verify each figure against the source URLs before merging."
          commit-message: "data: update OAS rules from canada.ca"
